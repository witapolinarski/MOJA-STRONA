# Używany tylko gdy w Netlify ustawiono Base directory = strzelam.
# Domyślnie strzelam.com buduje się z netlify.toml w katalogu głównym repozytorium.

[build]
  publish = "."
  command = "npm install"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["netlify/functions/assets/**"]
  external_node_modules = ["sharp"]

[[redirects]]
  from = "/test-bon"
  to = "/test-bon.html"
  status = 301

[[headers]]
  for = "/test-bon.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
