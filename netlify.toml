# strzelam.com — build z katalogu głównego repozytorium.

[build]
  command = "npm install && npm install --prefix strzelam"
  publish = "strzelam"
  functions = "strzelam/netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  included_files = ["strzelam/netlify/functions/assets/**"]
  external_node_modules = ["sharp"]

[[redirects]]
  from = "/test-bon"
  to = "/test-bon.html"
  status = 301

[[redirects]]
  from = "/statystyki"
  to = "/statystyki.html"
  status = 200

[[redirects]]
  from = "/voucher-success"
  to = "/voucher-success.html"
  status = 200

# Stare ścieżki WordPress (strzelamy.org.pl) — zachowane po przełączeniu DNS na Netlify
[[redirects]]
  from = "/wp-content/uploads/2024/04/STATUT-SAGITTARIUS.pdf"
  to = "/assets/statut-sagittarius.pdf"
  status = 301

[[redirects]]
  from = "/statut"
  to = "/assets/statut-sagittarius.pdf"
  status = 302

[[redirects]]
  from = "/statut-sagittarius.pdf"
  to = "/assets/statut-sagittarius.pdf"
  status = 302

[[headers]]
  for = "/test-bon.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/statystyki.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
