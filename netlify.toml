# strzelam.com — build z katalogu głównego repozytorium.

[build]
  # Netlify UI (strzelam-strona) ma publish = tmp/strzelam-fix2 — build musi go utworzyć.
  command = "npm install && npm install --prefix strzelam && rm -rf tmp/strzelam-fix2 && mkdir -p tmp && cp -a strzelam/. tmp/strzelam-fix2/"
  publish = "tmp/strzelam-fix2"
  functions = "strzelam/netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  included_files = ["strzelam/netlify/functions/assets/**"]
  external_node_modules = ["sharp"]

[[redirects]]
  from = "/test-bon"
  to = "/test-bon.html"
  status = 301

[[redirects]]
  from = "/statystyki"
  to = "/statystyki.html"
  status = 200

[[redirects]]
  from = "/voucher-success"
  to = "/voucher-success.html"
  status = 200

[[headers]]
  for = "/test-bon.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/statystyki.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
